services:
  db:
    image: mysql:8.4
    container_name: ecoviagem_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ecoviagem}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    ports:
      # Exposto só no localhost do host (não fica aberto na internet).
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - ecoviagem_mysqldata:/var/lib/mysql
      # Scripts executados automaticamente na PRIMEIRA inicialização, em ordem.
      # (Apenas 01 a 05; o 06 é para rodar manualmente como relatório.)
      - ./database/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/02_views.sql:/docker-entrypoint-initdb.d/02_views.sql:ro
      - ./database/03_functions_triggers.sql:/docker-entrypoint-initdb.d/03_functions_triggers.sql:ro
      - ./database/04_security.sql:/docker-entrypoint-initdb.d/04_security.sql:ro
      - ./database/05_seed.sql:/docker-entrypoint-initdb.d/05_seed.sql:ro
      - ./database/07_seed_extra.sql:/docker-entrypoint-initdb.d/07_seed_extra.sql:ro
      - ./database/08_eco_tokens_previsoes.sql:/docker-entrypoint-initdb.d/08_eco_tokens_previsoes.sql:ro
      - ./database/09_rotas_sustentaveis.sql:/docker-entrypoint-initdb.d/09_rotas_sustentaveis.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p${MYSQL_ROOT_PASSWORD:-root} || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15

  # API Spring Boot (opcional subir junto; por padrão rode o backend localmente).
  api:
    build: ./backend-springboot
    container_name: ecoviagem_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-ecoviagem}
      DB_USER: ${DB_USER:-app_api}
      DB_PASSWORD: ${DB_PASSWORD:-app_api_senha}
      PORT: 8080
      # E-mail para 2FA/recuperação (opcional). Sem SMTP → modo demonstração.
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-EcoViagem <no-reply@ecoviagem.local>}
    ports:
      # Só no localhost: o frontend (nginx) acessa a API pela rede interna do compose.
      - "127.0.0.1:8080:8080"
    profiles: ["full"]   # sobe só com: docker compose --profile full up

  # Frontend (React buildado, servido por nginx com proxy para a API).
  web:
    build:
      context: ./frontend
      args:
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:-}
    container_name: ecoviagem_web
    environment:
      PORT: 80
      API_URL: http://api:8080
    restart: unless-stopped
    depends_on:
      - api
    ports:
      # Porta pública do site. Em produção, use WEB_PORT=80 (ou 443 com HTTPS).
      - "${WEB_PORT:-5173}:80"
    profiles: ["full"]

volumes:
  ecoviagem_mysqldata:
