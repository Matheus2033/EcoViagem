# Nginx serve a SPA e faz proxy de /api para a API Spring Boot.
#
# Este arquivo é um TEMPLATE: a imagem oficial do nginx substitui ${PORT} e
# ${API_URL} por envsubst na inicialização (arquivos em /etc/nginx/templates/).
#   - Local (docker-compose): PORT=80, API_URL=http://api:8080
#   - Railway: PORT é injetado pela plataforma; API_URL aponta para a rede
#     privada da API, ex.: http://ecoviagem-api.railway.internal:8080
server {
    listen ${PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Encaminha as chamadas da API para o backend.
    location /api/ {
        proxy_pass ${API_URL};
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Arquivos do build com hash no nome: podem ficar em cache por 1 ano.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html NUNCA em cache: cada deploy novo chega na hora.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA: qualquer rota cai no index.html (React Router cuida do resto).
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
