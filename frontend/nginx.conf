# Nginx serve a SPA e faz proxy de /api para a API Spring Boot (serviço "api").
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Encaminha as chamadas da API para o container "api" na rede do compose.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Arquivos do build com hash no nome: podem ficar em cache por 1 ano.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html NUNCA em cache: assim cada deploy novo chega na hora
    # (senão o navegador continua apontando para o bundle antigo).
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA: qualquer rota cai no index.html (React Router cuida do resto).
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
