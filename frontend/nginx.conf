# Nginx serve a SPA e faz proxy de /api para a API Spring Boot (serviço "api").
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Encaminha as chamadas da API para o container "api" na rede do compose.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: qualquer rota cai no index.html (React Router cuida do resto).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
